[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desitter-perturbations"
version = "1.0.0"
description = "Perturbative gravity on de Sitter spacetime: symbolic geometry, gauge analysis, tensor dynamics and free-field quantization, with automated verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project authors" }]
keywords = ["general relativity", "de Sitter", "cosmological perturbation theory", "gravitational waves", "gauge symmetry", "quantum field theory in curved spacetime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "mpmath>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat>=5", "nbclient>=0.8", "ipykernel>=6", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: heavier symbolic calculations (deselect with -m 'not slow')",
]
